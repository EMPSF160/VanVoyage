<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account | VanVoyage</title>
  <meta name="description" content="Register for a VanVoyage account to unlock overland rigs, custom route guides, and seamless booking.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Master Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Fullscreen Auth Wrapper (No Public Header / Footer) -->
  <div class="auth-page-wrapper">
    
    <!-- Floating Theme Switcher -->
    <div class="position-absolute top-0 end-0 m-4 z-3">
      <button class="theme-toggle-btn" aria-label="Toggle theme">
        <i data-lucide="sun"></i>
      </button>
    </div>

    <!-- Registration Card -->
    <div class="auth-card" style="max-width: 520px;">
      
      <!-- Clickable Brand Logo redirecting to Home -->
      <a href="index.html" class="auth-logo-center" title="Return to VanVoyage Home">
        <img src="assets/images/logo.svg" alt="VanVoyage Logo" height="48">
      </a>

      <h2 class="auth-title">Join VanVoyage</h2>
      <p class="auth-sub">Create your account to start reserving backcountry expedition rigs.</p>

      <!-- Register Form with Validation -->
      <form id="registerForm" onsubmit="event.preventDefault(); handleRegisterSubmit();">
        
        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label-custom" for="regName">Full Legal Name *</label>
            <input type="text" class="form-control-custom" id="regName" placeholder="e.g. Sierra Walker" required>
          </div>

          <div class="col-md-6 col-12">
            <label class="form-label-custom" for="regEmail">Email Address *</label>
            <input type="email" class="form-control-custom" id="regEmail" placeholder="sierra@adventure.com" required>
          </div>

          <div class="col-md-6 col-12">
            <label class="form-label-custom" for="regPhone">Mobile Phone Number *</label>
            <input type="tel" class="form-control-custom" id="regPhone" placeholder="+1 (555) 019-2831" required>
          </div>

          <div class="col-md-6 col-12">
            <label class="form-label-custom" for="regPassword">Password *</label>
            <input type="password" class="form-control-custom" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required>
          </div>

          <div class="col-md-6 col-12">
            <label class="form-label-custom" for="regConfirmPassword">Confirm Password *</label>
            <input type="password" class="form-control-custom" id="regConfirmPassword" placeholder="Repeat password" minlength="6" required>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="licenseAgreement" required style="accent-color: var(--color-gold);">
          <label class="form-check-label small text-muted" for="licenseAgreement">
            I certify that I am at least 21 years old and hold a valid, non-provisional driver's license. I agree to the <a href="contact.html" class="text-gold">Rental Terms & Conditions</a>.
          </label>
        </div>

        <button type="submit" class="btn-gold w-100 py-3 mb-3">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Create Account & Access Dashboard</span>
        </button>

        <div class="text-center small text-muted">
          Already have an account? 
          <a href="login.html" class="text-gold fw-bold ms-1">Sign In</a>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-light-subtle">
        <a href="index.html" class="small text-muted d-inline-flex align-items-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Return to Public Website</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/booking.js"></script>

  <script>
    function handleRegisterSubmit() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const pass = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('regConfirmPassword').value;
      const agreed = document.getElementById('licenseAgreement').checked;

      if (!name || !email || !phone || !pass) {
        showToast('Please fill out all required fields', 'alert-circle');
        return;
      }

      if (pass !== confirmPass) {
        showToast('Passwords do not match. Please re-enter.', 'alert-triangle');
        return;
      }

      if (!agreed) {
        showToast('Please accept the driver terms and rental agreement', 'alert-circle');
        return;
      }

      const res = Auth.register({
        fullName: name,
        email: email,
        phone: phone,
        password: pass
      });

      if (res.success) {
        showToast(`Welcome to VanVoyage, ${name}! Your account is active.`, 'check-circle');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      } else {
        showToast(res.message, 'alert-circle');
      }
    }
  </script>
</body>
</html>
