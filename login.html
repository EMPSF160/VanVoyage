<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login | VanVoyage</title>
  <meta name="description" content="Sign in to your VanVoyage customer account to manage your bookings, saved campervans, and expedition itineraries.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Master Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Fullscreen Auth Wrapper (No Public Header / Footer) -->
  <div class="auth-page-wrapper">
    
    <!-- Floating Theme Switcher in top corner -->
    <div class="position-absolute top-0 end-0 m-4 z-3">
      <button class="theme-toggle-btn" aria-label="Toggle theme">
        <i data-lucide="sun"></i>
      </button>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      
      <!-- Clickable Brand Logo inside card linking to Home -->
      <a href="index.html" class="auth-logo-center" title="Return to VanVoyage Home">
        <img src="assets/images/logo.svg" alt="VanVoyage Logo" height="48">
      </a>

      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-sub">Access your expeditions, upcoming trips, and saved overland rigs.</p>

      <!-- 1-Click Demo Credentials Quick Autofill Helper -->
      <div class="demo-auth-box">
        <div>
          <strong>Demo Explorer Account:</strong><br>
          <span class="text-muted">alex.rivers@adventure.com • pass: adventure</span>
        </div>
        <button type="button" class="btn btn-sm btn-outline-warning" onclick="fillDemoCredentials()">
          Autofill
        </button>
      </div>

      <!-- Login Form with Validation -->
      <form id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
        <div class="mb-3">
          <label class="form-label-custom" for="loginEmail">Email Address</label>
          <input type="email" class="form-control-custom" id="loginEmail" placeholder="name@example.com" required>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label-custom mb-0" for="loginPassword">Password</label>
            <a href="forgot-password.html" class="text-gold small fw-semibold">Forgot Password?</a>
          </div>
          <div class="position-relative">
            <input type="password" class="form-control-custom" id="loginPassword" placeholder="••••••••" required>
            <button type="button" class="btn btn-sm text-muted position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent" onclick="togglePasswordVisibility('loginPassword', this)">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked style="accent-color: var(--color-gold);">
            <label class="form-check-label small text-muted" for="rememberMe">
              Remember me on this device
            </label>
          </div>
        </div>

        <button type="submit" class="btn-gold w-100 py-3 mb-3">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Sign In to Dashboard</span>
        </button>

        <div class="text-center small text-muted">
          Don't have an account yet? 
          <a href="register.html" class="text-gold fw-bold ms-1">Create Account</a>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-light-subtle">
        <a href="index.html" class="small text-muted d-inline-flex align-items-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Return to Public Website</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/booking.js"></script>

  <script>
    function fillDemoCredentials() {
      document.getElementById('loginEmail').value = 'alex.rivers@adventure.com';
      document.getElementById('loginPassword').value = 'adventure2026';
      showToast('Demo credentials filled!', 'check');
    }

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
      } else {
        field.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
      }
      initLucide();
    }

    function handleLoginSubmit() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;

      if (!email || !pass) {
        showToast('Please enter both email and password', 'alert-circle');
        return;
      }

      const res = Auth.login(email, pass, remember);
      showToast(`Welcome back, ${res.user.name}! Redirecting...`, 'check-circle');
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }
  </script>
</body>
</html>
